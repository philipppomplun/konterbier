<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchDay Dashboard</title>
  <style>
    :root {
      --bg-color: #0b130e;
      --card-bg: #121e16;
      --accent-color: #22c55e;
      --text-color: #ffffff;
      --text-muted: #a3a3a3;
      --border-color: #1f3325;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .search-container input {
      flex: 1;
      background: #080f0a;
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-container button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    #matchesContainer {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .votes-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .league-name {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .match-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .shield-icon {
      font-size: 2.5rem;
    }

    .team span {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .match-info h2 {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .match-info p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: #1a2b20;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ MatchDay Dashboard</h1>
  </header>

  <form id="searchForm" class="search-container">
    <input type="url" id="searchInput" placeholder="FuPa Spiel-Link einfügen..." required>
    <button type="submit">Laden</button>
  </form>

  <div class="section-title">⚡ Anstehende Matches</div>
  <div id="matchesContainer">
    <p style="text-align:center; color: var(--text-muted);">Lade Spiele...</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
