<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchDay Dashboard</title>
  <style>
    :root {
      --bg-color: #0b130e;
      --card-bg: #121e16;
      --accent-color: #22c55e;
      --text-color: #ffffff;
      --text-muted: #a3a3a3;
      --border-color: #1f3325;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .search-container input {
      flex: 1;
      background: #080f0a;
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-container button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-container button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    #matchesContainer {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .votes-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .league-name {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .match-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .shield-icon {
      font-size: 2.5rem;
    }

    .team span {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .match-info h2 {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .match-info p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: #1a2b20;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ MatchDay Dashboard</h1>
  </header>

  <form id="searchForm" class="search-container">
    <input type="url" id="searchInput" placeholder="FuPa Spiel-Link einfügen..." required>
    <button type="submit" id="submitBtn">Laden</button>
  </form>

  <div class="section-title">⚡ Anstehende Matches</div>
  <div id="matchesContainer">
    <p style="text-align:center; color: var(--text-muted);">Lade Spiele...</p>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = 'DEINE_GOOGLE_APPS_SCRIPT_URL';

    document.addEventListener('DOMContentLoaded', () => {
      loadMatches();

      document.getElementById('searchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const urlInput = document.getElementById('searchInput');
        const submitBtn = document.getElementById('submitBtn');
        const url = urlInput.value.trim();

        if (!url.includes('fupa.net')) {
          alert('Bitte gib einen gültigen FuPa.net Link ein!');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Lade...';

        try {
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
          const response = await fetch(proxyUrl);
          const data = await response.json();
          const html = data.contents;

          let homeTeam = "Heimteam", awayTeam = "Auswärtsteam", league = "Amateurliga";
          let dateText = "Demnächst", timeText = "15:00 Uhr", locationName = "Sportplatz";
          let address = "", homeLogo = "", awayLogo = "", lat = 53.5511, lng = 9.9937;

          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const scripts = doc.querySelectorAll('script[type="application/ld+json"]');

          scripts.forEach(script => {
            try {
              const matchData = JSON.parse(script.textContent);
              if (matchData.homeTeam || matchData['@type'] === 'SportsEvent') {
                if (matchData.homeTeam) homeTeam = matchData.homeTeam.name || homeTeam;
                if (matchData.awayTeam) awayTeam = matchData.awayTeam.name || awayTeam;
                if (matchData.homeTeam?.image) homeLogo = matchData.homeTeam.image;
                if (matchData.awayTeam?.image) awayLogo = matchData.awayTeam.image;

                if (matchData.location) {
                  locationName = matchData.location.name || locationName;
                  if (matchData.location.geo) {
                    lat = parseFloat(matchData.location.geo.latitude) || lat;
                    lng = parseFloat(matchData.location.geo.longitude) || lng;
                  }
                }
                if (matchData.startDate) {
                  const d = new Date(matchData.startDate);
                  dateText = d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
                  timeText = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + " Uhr";
                }
              }
            } catch (e) {}
          });

          if (homeTeam === "Heimteam") {
            const title = doc.querySelector('title')?.textContent || '';
            const parts = title.split(/ vs\.? | gegen | - | : /i);
            if (parts.length >= 2) {
              homeTeam = parts[0].trim();
              awayTeam = parts[1].trim();
            }
          }

          const payload = {
            action: "addParsedMatch",
            league, homeTeam, homeLogo, awayTeam, awayLogo,
            timeText, dateText, locationName, address, lat, lng
          };

          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          alert("Spiel erfolgreich hinzugefügt!");
          urlInput.value = '';
          loadMatches();

        } catch (err) {
          console.error(err);
          alert("Fehler beim Auslesen des Links.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Laden';
        }
      });
    });

    async function loadMatches() {
      const container = document.getElementById('matchesContainer');
      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=getMatches`);
        const matches = await res.json();

        if (!matches || matches.length === 0) {
          container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Keine anstehenden Spiele gefunden.</p>';
          return;
        }

        container.innerHTML = matches.map(m => `
          <div class="match-card">
            <div class="votes-badge">🔥 ${m.votes || 0} VOTES</div>
            <div class="league-name">${m.league}</div>
            <div class="match-main">
              <div class="team">
                ${m.homeLogo ? `<img src="${m.homeLogo}" style="width:40px;height:40px;object-fit:contain;">` : `<div class="shield-icon">🛡️</div>`}
                <span>${m.homeTeam}</span>
              </div>
              <div class="match-info">
                <h2>${m.timeText}</h2>
                <p>${m.dateText}</p>
                <p class="location">📍 ${m.locationName}</p>
              </div>
              <div class="team">
                ${m.awayLogo ? `<img src="${m.awayLogo}" style="width:40px;height:40px;object-fit:contain;">` : `<div class="shield-icon">🛡️</div>`}
                <span>${m.awayTeam}</span>
              </div>
            </div>
            <div class="actions">
              <button onclick="voteMatch('${m.id}', 'up')" class="btn-action">👍 Upvote</button>
              <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(m.locationName + ' ' + m.address)}" target="_blank" class="btn-action">🚴 Route</a>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Konnte Spiele nicht laden.</p>';
      }
    }

    async function voteMatch(id, type) {
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, type })
        });
        setTimeout(loadMatches, 500);
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
