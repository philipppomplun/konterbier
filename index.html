<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchDay Dashboard</title>
  <style>
    :root {
      --bg-color: #0b130e;
      --card-bg: #121e16;
      --accent-color: #22c55e;
      --text-color: #ffffff;
      --text-muted: #a3a3a3;
      --border-color: #1f3325;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    header h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .search-container input {
      flex: 1;
      background: #080f0a;
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-container button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .search-container button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    #matchesContainer {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .votes-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .league-name {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .match-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .shield-icon {
      font-size: 2.5rem;
    }

    .team span {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .match-info h2 {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .match-info p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: #1a2b20;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ MatchDay Dashboard</h1>
  </header>

  <form id="searchForm" class="search-container">
    <input type="url" id="searchInput" placeholder="FuPa Spiel-Link einfügen..." required>
    <button type="submit" id="submitBtn">Laden</button>
  </form>

  <div class="section-title">⚡ Anstehende Matches</div>
  <div id="matchesContainer">
    <p style="text-align:center; color: var(--text-muted);">Lade Spiele...</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // HIER DEINE GOOGLE APPS SCRIPT WEB-APP URL EINTRAGEN
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcxoZ2EX6dRsg3SVE65dgCmp5y__ElJqAIb67QK3axDGcjUKVoaIJJMiJWNXHPKm_z/exec"; 
        
        const fallbackLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>";

        let matches = [];
        let map;
        let markers = [];

        // UI Elemente
        const loadBtn = document.querySelector('.btn-load');
        const searchInput = document.querySelector('.search-container input');

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([53.5511, 9.9937], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        function updateMap() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            const bounds = [];

            matches.forEach(m => {
                if(m.lat && m.lng) {
                    const marker = L.marker([m.lat, m.lng]).addTo(map);
                    marker.bindPopup(`<b>${m.homeTeam} vs ${m.awayTeam}</b><br>${m.locationName}`);
                    markers.push(marker);
                    bounds.push([m.lat, m.lng]);
                }
            });

            if(bounds.length > 0) map.fitBounds(bounds, { padding: [40, 40] });
        }

        function renderMatches() {
            // Nach Votes sortieren (höchste oben)
            matches.sort((a, b) => b.votes - a.votes);

            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            if (matches.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Noch keine Spiele geladen.</p>';
                return;
            }

            matches.forEach(match => {
                // Route wird direkt für die Anfahrt per Fahrrad konfiguriert (&dirflg=b)
                const destination = match.address || match.locationName || `${match.lat},${match.lng}`;
                const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&dirflg=b`;

                const wrapper = document.createElement('div');
                wrapper.className = 'match-card-wrapper';

                wrapper.innerHTML = `
                    <div class="badge-vote-container">
                        <div class="status-badge">
                            🔥 ${match.votes} VOTES
                        </div>
                    </div>

                    <div class="match-card">
                        <div class="team home">
                            <img src="${match.homeLogo || fallbackLogo}" class="team-logo" referrerpolicy="no-referrer">
                            <span class="team-name">${match.homeTeam}</span>
                        </div>

                        <div class="match-center">
                            <span class="league-name">${match.league}</span>
                            <span class="match-time">${match.timeText}</span>
                            <span class="match-date">${match.dateText}</span>
                            
                            <div class="location-info" title="${match.locationName}">
                                <span>📍 ${match.locationName}</span>
                            </div>

                            <div class="card-actions">
                                <button class="action-btn btn-upvote ${match.userVoted ? 'voted' : ''}" onclick="toggleVote('${match.id}')">
                                    👍 <span>${match.userVoted ? 'Gevotet' : 'Upvote'}</span>
                                </button>
                                <a href="${googleMapsUrl}" target="_blank" class="action-btn btn-route">
                                    🧭 <span>Route</span>
                                </a>
                            </div>
                        </div>

                        <div class="team away">
                            <img src="${match.awayLogo || fallbackLogo}" class="team-logo" referrerpolicy="no-referrer">
                            <span class="team-name">${match.awayTeam}</span>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });

            updateMap();
        }

        // Daten vom Google Apps Script fetchen
        async function fetchMatches() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getMatches`);
                const data = await response.json();
                
                // Lokalen userVoted Status beibehalten, falls vorhanden
                matches = data.map(serverMatch => {
                    const localMatch = matches.find(m => m.id === serverMatch.id);
                    return {
                        ...serverMatch,
                        userVoted: localMatch ? localMatch.userVoted : false
                    };
                });
                
                renderMatches();
            } catch (error) {
                console.error("Fehler beim Laden der Spiele:", error);
            }
        }

        // Neues Spiel via FuPa-Link hinzufügen
        loadBtn.addEventListener('click', async () => {
            const url = searchInput.value.trim();
            if (!url) return;

            loadBtn.textContent = "Lädt...";
            loadBtn.style.opacity = "0.7";
            
            try {
                await fetch(`${SCRIPT_URL}?action=addFuPaMatch&url=${encodeURIComponent(url)}`);
                searchInput.value = "";
                await fetchMatches(); // Nach dem Hinzufügen Liste neu laden
            } catch (error) {
                console.error("Fehler beim Hinzufügen:", error);
                alert("Fehler beim Laden des FuPa-Links.");
            } finally {
                loadBtn.textContent = "Laden";
                loadBtn.style.opacity = "1";
            }
        });

        // Voting Logik mit Backend-Synchronisation
        async function toggleVote(id) {
            const match = matches.find(m => m.id === id);
            if(!match) return;

            const isVotingUp = !match.userVoted;
            
            // Optimistisches UI-Update (direkt anzeigen, bevor der Server antwortet)
            match.userVoted = isVotingUp;
            match.votes += isVotingUp ? 1 : -1;
            renderMatches();

            try {
                // Post Request ans Apps Script als text/plain um CORS Preflight zu vermeiden
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        id: id,
                        type: isVotingUp ? 'up' : 'down'
                    })
                });
            } catch(e) {
                console.error("Fehler beim Voten:", e);
                // Bei Fehler das UI wieder zurücksetzen
                match.userVoted = !isVotingUp;
                match.votes += isVotingUp ? -1 : 1;
                renderMatches();
            }
        }

        window.onload = () => {
            initMap();
            if (SCRIPT_URL === "DEINE_WEB_APP_URL_HIER_EINTRAGEN") {
                document.getElementById('matchesContainer').innerHTML = '<p style="color: #ff4444; text-align: center;">Bitte trage zuerst deine Google Apps Script URL im Code ein!</p>';
            } else {
                fetchMatches();
            }
        };
    </script>
</body>
</html>
