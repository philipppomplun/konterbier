<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchDay Dashboard</title>
  <style>
    :root {
      --bg-color: #0b130e;
      --card-bg: #121e16;
      --accent-color: #22c55e;
      --text-color: #ffffff;
      --text-muted: #a3a3a3;
      --border-color: #1f3325;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Suchleiste */
    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }

    .search-container input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-container input:focus {
      border-color: var(--accent-color);
    }

    .search-container button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .search-container button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Match Cards */
    .section-title {
      font-size: 1.1rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #matchesContainer {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      text-align: center;
    }

    .votes-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .league-name {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .match-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .team img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .team span {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .match-info h2 {
      font-size: 1.4rem;
      color: #fff;
    }

    .match-info p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-vote {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-vote:hover {
      background: var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ MatchDay Dashboard</h1>
  </header>

  <!-- Formular für FuPa-Link -->
  <form id="searchForm" class="search-container">
    <input type="url" id="searchInput" placeholder="FuPa Spiel-Link einfügen..." required>
    <button type="submit">Laden</button>
  </form>

  <!-- Container für anstehende Matches -->
  <div class="section-title">⚡ Anstehende Matches</div>
  <div id="matchesContainer">
    <p style="text-align:center; color: var(--text-muted);">Lade Spiele...</p>
  </div>

  <!-- JavaScript Datei einbinden -->
  <script src="app.js"></script>
</body>
</html>
