
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchDay • Dark Mode</title>

    <!-- Leaflet Maps CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Font: Zalando Sans SemiExpanded -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b110d;
            --bg-card: rgba(23, 33, 26, 0.7);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-green: #22c55e;
            --accent-lime: #ccff00;
            --text-primary: #ffffff;
            --text-muted: #8e9b90;
            --glow-color: rgba(34, 197, 94, 0.25);
            --radius-lg: 24px;
            --radius-pill: 99px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zalando Sans SemiExpanded', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.12), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(204, 255, 0, 0.05), transparent 40%);
        }

        .app-shell {
            width: 100%;
            max-width: 900px;
            background: #111a13;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 36px;
            padding: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Header Desktop */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Teamgeist Logo Icon */
        .teamgeist-logo {
            width: 48px;
            height: 48px;
            min-width: 48px;
            filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.3));
        }

        .greeting {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-pill);
            padding: 6px 6px 6px 16px;
            width: 320px;
        }

        .search-container input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.85rem;
            width: 100%;
        }

        .search-container input::placeholder {
            color: var(--text-muted);
        }

        .btn-load {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-load:hover {
            background: var(--accent-lime);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Card Wrapper & Glow Effect */
        .match-card-wrapper {
            position: relative;
        }

        .match-card-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--glow-color), transparent 70%);
            border-radius: var(--radius-lg);
            z-index: 0;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .match-card-wrapper:hover::before {
            opacity: 1;
        }

        .match-card {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            display: grid;
            grid-template-columns: 1fr 220px 1fr;
            align-items: center;
            gap: 16px;
        }

        /* Status Badge */
        .badge-vote-container {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .status-badge {
            background: #17261c;
            color: var(--accent-lime);
            border: 1px solid rgba(204, 255, 0, 0.3);
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Team Section Desktop */
        .team {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .team.home { 
            justify-content: flex-end; 
            text-align: right; 
        }

        .team.away { 
            justify-content: flex-start; 
            text-align: left; 
        }

        .team-name {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .team-logo {
            width: 52px;
            height: 52px;
            min-width: 52px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        /* Match Info Center */
        .match-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .league-name {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .match-time {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .match-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        /* Actions Area */
        .card-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
        }

        .action-btn {
            height: 38px;
            border-radius: var(--radius-pill);
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            border: 1px solid var(--border-card);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .btn-upvote {
            width: 110px;
        }

        .btn-upvote:hover {
            background: rgba(34, 197, 94, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
            transform: translateY(-1px);
        }

        .btn-upvote.voted {
            background: var(--accent-green);
            color: #000000;
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
        }

        .btn-route {
            width: 90px;
            color: var(--text-muted);
        }

        .btn-route:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        /* Map Section */
        .map-section {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #map {
            width: 100%;
            height: 260px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        .leaflet-container {
            background: #0d140e !important;
        }

        /* --- MOBILE OPTIMIERUNG --- */
        @media (max-width: 768px) {
            .app-shell {
                padding: 20px 14px;
            }

            /* Header & Profil mittig */
            .header { 
                flex-direction: column; 
                align-items: center; 
                gap: 20px; 
            }

            .user-profile {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 8px;
            }
            
            .search-container { 
                width: 100%; 
            }

            /* 3 Spalten nebeneinander beibehalten */
            .match-card { 
                grid-template-columns: 1fr auto 1fr; 
                gap: 8px; 
                padding: 22px 12px 16px 12px;
            }

            /* Teams: Wappen OBERHALB des Vereinsnamens */
            .team {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 8px;
            }

            .team.home, .team.away {
                justify-content: flex-start;
                text-align: center;
            }

            .team-logo {
                width: 44px;
                height: 44px;
                min-width: 44px;
            }

            .team-name {
                font-size: 0.82rem;
                word-break: break-word;
            }

            .match-time {
                font-size: 1.1rem;
            }

            .league-name {
                font-size: 0.65rem;
            }

            .location-info {
                max-width: 130px;
                font-size: 0.7rem;
            }

            .card-actions {
                flex-direction: column;
                gap: 6px;
            }

            .action-btn {
                height: 32px;
                font-size: 0.72rem;
            }

            .btn-upvote, .btn-route {
                width: 100%;
                max-width: 95px;
            }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <header class="header">
            <div class="user-profile">
                <!-- SVG Logo: Teamgeist WM 2006 Ball Design -->
                <svg class="teamgeist-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Ball Basis -->
                    <circle cx="50" cy="50" r="46" fill="#f8fafc" stroke="#111a13" stroke-width="2"/>
                    
                    <!-- Teamgeist charakteristische geschwungene Propeller-Panels (Schwarz mit Neongrün-Akzent) -->
                    <path d="M 50,4 C 65,12 85,30 85,50 C 85,68 65,88 50,96 C 60,75 60,25 50,4 Z" fill="#111a13"/>
                    <path d="M 50,4 C 65,12 85,30 85,50 C 85,68 65,88 50,96 C 60,75 60,25 50,4 Z" fill="none" stroke="#22c55e" stroke-width="2.5"/>

                    <path d="M 50,4 C 35,12 15,30 15,50 C 15,68 35,88 50,96 C 40,75 40,25 50,4 Z" fill="#111a13"/>
                    <path d="M 50,4 C 35,12 15,30 15,50 C 15,68 35,88 50,96 C 40,75 40,25 50,4 Z" fill="none" stroke="#22c55e" stroke-width="2.5"/>

                    <path d="M 4,50 C 12,35 30,15 50,15 C 68,15 88,35 96,50 C 75,40 25,40 4,50 Z" fill="#111a13"/>
                    <path d="M 4,50 C 12,35 30,15 50,15 C 68,15 88,35 96,50 C 75,40 25,40 4,50 Z" fill="none" stroke="#22c55e" stroke-width="2.5"/>

                    <path d="M 4,50 C 12,65 30,85 50,85 C 68,85 88,65 96,50 C 75,60 25,60 4,50 Z" fill="#111a13"/>
                    <path d="M 4,50 C 12,65 30,85 50,85 C 68,85 88,65 96,50 C 75,60 25,60 4,50 Z" fill="none" stroke="#22c55e" stroke-width="2.5"/>

                    <!-- Zierpunkte & Details -->
                    <circle cx="50" cy="50" r="6" fill="#ccff00"/>
                    <circle cx="50" cy="50" r="46" fill="none" stroke="#22c55e" stroke-width="3"/>
                </svg>
                
                <div>
                    <div class="greeting">Willkommen zurück 👋</div>
                    <div class="user-name">MatchDay Dashboard</div>
                </div>
            </div>

            <div class="search-container">
                <input type="text" placeholder="FuPa Spiel-Link einfügen...">
                <button class="btn-load">Laden</button>
            </div>
        </header>

        <main style="display: flex; flex-direction: column; gap: 16px;">
            <div class="section-header">
                <h2 class="section-title">⚡ Anstehende Matches</h2>
            </div>

            <div class="matches-grid" id="matchesContainer">
                <!-- Dynamisch generiert -->
            </div>
        </main>

        <section class="map-section">
            <div class="section-title" style="font-size: 0.95rem;">📍 Spielstätten auf der Karte</div>
            <div id="map"></div>
        </section>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // HIER DEINE GOOGLE APPS SCRIPT WEB-APP URL EINTRAGEN
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcxoZ2EX6dRsg3SVE65dgCmp5y__ElJqAIb67QK3axDGcjUKVoaIJJMiJWNXHPKm_z/exec"; 
        
        const fallbackLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>";

        let matches = [];
        let map;
        let markers = [];

        // UI Elemente
        const loadBtn = document.querySelector('.btn-load');
        const searchInput = document.querySelector('.search-container input');

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([53.5511, 9.9937], 11);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        function updateMap() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            const bounds = [];

            matches.forEach(m => {
                if(m.lat && m.lng) {
                    const marker = L.marker([m.lat, m.lng]).addTo(map);
                    marker.bindPopup(`<b>${m.homeTeam} vs ${m.awayTeam}</b><br>${m.locationName}`);
                    markers.push(marker);
                    bounds.push([m.lat, m.lng]);
                }
            });

            if(bounds.length > 0) map.fitBounds(bounds, { padding: [40, 40] });
        }

        function renderMatches() {
            // Nach Votes sortieren (höchste oben)
            matches.sort((a, b) => b.votes - a.votes);

            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            if (matches.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Noch keine Spiele geladen.</p>';
                return;
            }

            matches.forEach(match => {
                // Route wird direkt für die Anfahrt per Fahrrad konfiguriert (&dirflg=b)
                const destination = match.address || match.locationName || `${match.lat},${match.lng}`;
                const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&dirflg=b`;

                const wrapper = document.createElement('div');
                wrapper.className = 'match-card-wrapper';

                wrapper.innerHTML = `
                    <div class="badge-vote-container">
                        <div class="status-badge">
                            🔥 ${match.votes} VOTES
                        </div>
                    </div>

                    <div class="match-card">
                        <div class="team home">
                            <img src="${match.homeLogo || fallbackLogo}" class="team-logo" referrerpolicy="no-referrer">
                            <span class="team-name">${match.homeTeam}</span>
                        </div>

                        <div class="match-center">
                            <span class="league-name">${match.league}</span>
                            <span class="match-time">${match.timeText}</span>
                            <span class="match-date">${match.dateText}</span>
                            
                            <div class="location-info" title="${match.locationName}">
                                <span>📍 ${match.locationName}</span>
                            </div>

                            <div class="card-actions">
                                <button class="action-btn btn-upvote ${match.userVoted ? 'voted' : ''}" onclick="toggleVote('${match.id}')">
                                    👍 <span>${match.userVoted ? 'Gevotet' : 'Upvote'}</span>
                                </button>
                                <a href="${googleMapsUrl}" target="_blank" class="action-btn btn-route">
                                    🧭 <span>Route</span>
                                </a>
                            </div>
                        </div>

                        <div class="team away">
                            <img src="${match.awayLogo || fallbackLogo}" class="team-logo" referrerpolicy="no-referrer">
                            <span class="team-name">${match.awayTeam}</span>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });

            updateMap();
        }

        // Daten vom Google Apps Script fetchen
        async function fetchMatches() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getMatches`);
                const data = await response.json();
                
                // Lokalen userVoted Status beibehalten, falls vorhanden
                matches = data.map(serverMatch => {
                    const localMatch = matches.find(m => m.id === serverMatch.id);
                    return {
                        ...serverMatch,
                        userVoted: localMatch ? localMatch.userVoted : false
                    };
                });
                
                renderMatches();
            } catch (error) {
                console.error("Fehler beim Laden der Spiele:", error);
            }
        }

        // Neues Spiel via FuPa-Link hinzufügen
        loadBtn.addEventListener('click', async () => {
            const url = searchInput.value.trim();
            if (!url) return;

            loadBtn.textContent = "Lädt...";
            loadBtn.style.opacity = "0.7";
            
            try {
                await fetch(`${SCRIPT_URL}?action=addFuPaMatch&url=${encodeURIComponent(url)}`);
                searchInput.value = "";
                await fetchMatches(); // Nach dem Hinzufügen Liste neu laden
            } catch (error) {
                console.error("Fehler beim Hinzufügen:", error);
                alert("Fehler beim Laden des FuPa-Links.");
            } finally {
                loadBtn.textContent = "Laden";
                loadBtn.style.opacity = "1";
            }
        });

        // Voting Logik mit Backend-Synchronisation
        async function toggleVote(id) {
            const match = matches.find(m => m.id === id);
            if(!match) return;

            const isVotingUp = !match.userVoted;
            
            // Optimistisches UI-Update (direkt anzeigen, bevor der Server antwortet)
            match.userVoted = isVotingUp;
            match.votes += isVotingUp ? 1 : -1;
            renderMatches();

            try {
                // Post Request ans Apps Script als text/plain um CORS Preflight zu vermeiden
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        id: id,
                        type: isVotingUp ? 'up' : 'down'
                    })
                });
            } catch(e) {
                console.error("Fehler beim Voten:", e);
                // Bei Fehler das UI wieder zurücksetzen
                match.userVoted = !isVotingUp;
                match.votes += isVotingUp ? -1 : 1;
                renderMatches();
            }
        }

        window.onload = () => {
            initMap();
            if (SCRIPT_URL === "DEINE_WEB_APP_URL_HIER_EINTRAGEN") {
                document.getElementById('matchesContainer').innerHTML = '<p style="color: #ff4444; text-align: center;">Bitte trage zuerst deine Google Apps Script URL im Code ein!</p>';
            } else {
                fetchMatches();
            }
        };
    </script>
</body>
</html>
