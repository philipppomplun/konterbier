<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchDay Dashboard</title>
  <style>
    :root {
      --bg-color: #080f0a;
      --card-bg: #101c13;
      --border-color: #1b2e20;
      --accent-color: #22c55e;
      --text-color: #ffffff;
      --text-muted: #83988a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header & Suche */
    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-container {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .search-container input {
      flex: 1;
      background: #0d1710;
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-container input:focus {
      border-color: var(--accent-color);
    }

    .search-container button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Match Cards */
    #matchesContainer {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      position: relative;
    }

    .votes-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.08);
      color: #a3e635;
      border: 1px solid #a3e635;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .league-name {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .match-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .team svg {
      width: 48px;
      height: 54px;
      stroke: var(--accent-color);
      fill: none;
      stroke-width: 2;
    }

    .team span {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .match-info h2 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
    }

    .match-info .sub-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
      font-weight: 600;
    }

    .match-info .location {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 6px;
    }

    /* Buttons */
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: #18281b;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 22px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: #203624;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ MatchDay Dashboard</h1>
  </header>

  <form id="searchForm" class="search-container">
    <input type="url" id="searchInput" placeholder="FuPa Spiel-Link einfügen..." required>
    <button type="submit">Laden</button>
  </form>

  <div class="section-title">⚡ Anstehende Matches</div>
  <div id="matchesContainer">
    <!-- Platzhalter-Karte aus dem vorherigen Design -->
    <div class="match-card">
      <div class="votes-badge">🔥 0 VOTES</div>
      <div class="league-name">AMATEURLIGA</div>
      <div class="match-main">
        <div class="team">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Heimteam</span>
        </div>
        <div class="match-info">
          <h2>15:00 Uhr</h2>
          <p class="sub-text">Demnächst</p>
          <p class="location">📍 Sportplatz</p>
        </div>
        <div class="team">
          <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Auswärtsteam</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn-action">👍 Upvote</button>
        <button class="btn-action">🧩 Route</button>
      </div>
    </div>
  </div>

  <div class="section-title">📍 Spielstätten auf der Karte</div>
  <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; height: 180px; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
    Karte wird hier geladen
  </div>

  <script>
    // Trage hier deine Google Web App URL ein
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/library/d/1GQPDuBMAN82GhRSWMJovz8o-Rq0Dy39_LzZiBD20IGsLkh53Edtj8W05/5';

    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('searchInput').value;
      
      try {
        await fetch(`${GOOGLE_SCRIPT_URL}?action=addFuPaMatch&url=${encodeURIComponent(url)}`, { mode: 'no-cors' });
        alert("Link übermittelt!");
        location.reload();
      } catch(err) {
        alert("Fehler beim Absenden!");
      }
    });
  </script>
</body>
</html>
