<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KonterBier – Gut Kick!</title>

    <!-- Leaflet Maps CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b110d;
            --bg-card: rgba(23, 33, 26, 0.7);
            --border-card: rgba(255, 255, 255, 0.08);
            --accent-green: #22c55e;
            --accent-lime: #ccff00;
            --text-primary: #ffffff;
            --text-muted: #8e9b90;
            --glow-color: rgba(34, 197, 94, 0.25);
            --radius-lg: 24px;
            --radius-pill: 99px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zalando Sans SemiExpanded', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.12), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(204, 255, 0, 0.05), transparent 40%);
        }

        .app-shell {
            width: 100%;
            max-width: 900px;
            background: #111a13;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 36px;
            padding: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .teamgeist-logo {
            width: 48px;
            height: 48px;
            min-width: 48px;
            object-fit: cover;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.3));
        }

        .greeting {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .match-card-wrapper {
            position: relative;
        }

        .match-card-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--glow-color), transparent 70%);
            border-radius: var(--radius-lg);
            z-index: 0;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        .match-card-wrapper:hover::before {
            opacity: 1;
        }

        .match-card {
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            display: grid;
            grid-template-columns: 1fr 220px 1fr;
            align-items: center;
            gap: 16px;
        }

        .badge-vote-container {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        .badge-route-container {
            position: absolute;
            top: -12px;
            right: 24px;
            z-index: 2;
            text-decoration: none;
        }

        .status-badge {
            background: #17261c;
            color: var(--accent-lime);
            border: 1px solid rgba(204, 255, 0, 0.3);
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .route-badge {
            background: #17261c;
            color: var(--text-primary);
            border: 1px solid var(--border-card);
            transition: all 0.2s ease;
        }

        .route-badge:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .team {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .team.home { justify-content: flex-end; text-align: right; }
        .team.away { justify-content: flex-start; text-align: left; }

        .team-name {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .team-logo {
            width: 52px;
            height: 52px;
            min-width: 52px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .match-center {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .league-name {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .match-time {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .match-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }

        .card-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
        }

        .action-btn {
            height: 38px;
            border-radius: var(--radius-pill);
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            border: 1px solid var(--border-card);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .btn-upvote {
            width: 110px;
        }

        .btn-upvote:hover {
            background: rgba(34, 197, 94, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
            transform: translateY(-1px);
        }

        .btn-upvote.voted {
            background: var(--accent-green);
            color: #000000;
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
        }

        .map-section {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-lg);
            padding: 20px;
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        #map {
            width: 100%;
            height: 260px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        .leaflet-container {
            background: #0d140e !important;
        }

        @media (max-width: 768px) {
            .app-shell { padding: 20px 14px; }
            .header { flex-direction: column; align-items: center; gap: 20px; }
            .user-profile { flex-direction: column; align-items: center; text-align: center; gap: 8px; }
            .match-card { grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 22px 12px 16px 12px; }
            .team { flex-direction: column; align-items: center; text-align: center; gap: 8px; }
            .team.home, .team.away { justify-content: flex-start; text-align: center; }
            .team-logo { width: 44px; height: 44px; min-width: 44px; }
            .team-name { font-size: 0.82rem; word-break: break-word; }
            .match-time { font-size: 1.1rem; }
            .league-name { font-size: 0.65rem; }
            .location-info { max-width: 130px; font-size: 0.7rem; }
            .action-btn { height: 32px; font-size: 0.72rem; }
            .btn-upvote { width: 100%; max-width: 95px; }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <header class="header">
            <div class="user-profile">
                <!-- Ersetze hier den Link mit deinem Logo -->
                <img src="https://i.pinimg.com/736x/24/13/6f/24136fe1cedbce0fd458eadbc4be52ab.jpg" alt="Logo" class="teamgeist-logo">
                
                <div>
                    <div class="greeting">Hallo & gut Kick! 👋</div>
                    <div class="user-name">KonterBier - Spielübersicht</div>
                </div>
            </div>
        </header>

        <main style="display: flex; flex-direction: column; gap: 16px;">
            <div class="section-header">
                <h2 class="section-title">⚡ Anstehende Matches</h2>
            </div>

            <div class="matches-grid" id="matchesContainer">
                <!-- Dynamisch generiert -->
            </div>
        </main>
        
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // HIER DEINE GOOGLE APPS SCRIPT WEB-APP URL EINTRAGEN
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcxoZ2EX6dRsg3SVE65dgCmp5y__ElJqAIb67QK3axDGcjUKVoaIJJMiJWNXHPKm_z/exec"; 
        
        const fallbackLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 24 24' fill='none' stroke='%2322c55e' stroke-width='2'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>";

        let matches = [];

        function renderMatches() {
            matches.sort((a, b) => b.votes - a.votes);

            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            if (matches.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Noch keine Spiele geladen oder URL fehlt.</p>';
                return;
            }

            matches.forEach(match => {
                const destination = match.address || match.locationName || `${match.lat},${match.lng}`;
                const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&dirflg=b`;

                const wrapper = document.createElement('div');
                wrapper.className = 'match-card-wrapper';

                wrapper.innerHTML = `
                    <div class="badge-vote-container">
                        <div class="status-badge">
                            🔥 ${match.votes} VOTES
                        </div>
                    </div>

                    <a href="${googleMapsUrl}" target="_blank" class="badge-route-container" title="Route starten">
                        <div class="status-badge route-badge">
                            🧭 Route
                        </div>
                    </a>

                    <div class="match-card">
                        <div class="team home">
                            <img src="${match.homeLogo || fallbackLogo}" class="team-logo" referrerpolicy="no-referrer">
                            <span class="team-name">${match.homeTeam}</span>
                        </div>

                        <div class="match-center">
                            <span class="league-name">${match.league}</span>
                            <span class="match-time">${match.dateText}</span>
                            <span class="match-date">${match.timeText}</span>
                            
                            <div class="location-info" title="${match.locationName}">
                                <span>📍 ${match.locationName}</span>
                            </div>

                            <div class="card-actions">
                                <button class="action-btn btn-upvote ${match.userVoted ? 'voted' : ''}" onclick="toggleVote('${match.id}')">
                                    👍 <span>${match.userVoted ? 'Gevotet' : 'Upvote'}</span>
                                </button>
                            </div>
                        </div>

                        <div class="team away">
                            <img src="${match.awayLogo || fallbackLogo}" class="team-logo" referrerpolicy="no-referrer">
                            <span class="team-name">${match.awayTeam}</span>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            });
        }

        async function fetchMatches() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getMatches`);
                const data = await response.json();
                
                matches = data.map(serverMatch => {
                    const localMatch = matches.find(m => m.id === serverMatch.id);
                    return {
                        ...serverMatch,
                        userVoted: localMatch ? localMatch.userVoted : false
                    };
                });
                
                renderMatches();
            } catch (error) {
                console.error("Fehler beim Laden der Spiele:", error);
            }
        }

        async function toggleVote(id) {
            const match = matches.find(m => m.id === id);
            if(!match) return;

            const isVotingUp = !match.userVoted;
            
            match.userVoted = isVotingUp;
            match.votes += isVotingUp ? 1 : -1;
            renderMatches();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        id: id,
                        type: isVotingUp ? 'up' : 'down'
                    })
                });
            } catch(e) {
                console.error("Fehler beim Voten:", e);
                match.userVoted = !isVotingUp;
                match.votes += isVotingUp ? -1 : 1;
                renderMatches();
            }
        }

        window.onload = () => {
            if (SCRIPT_URL === "DEINE_WEB_APP_URL_HIER_EINTRAGEN") {
                document.getElementById('matchesContainer').innerHTML = '<p style="color: #ff4444; text-align: center;">Bitte trage zuerst deine Google Apps Script URL im Code ein!</p>';
            } else {
                fetchMatches();
            }
        };
    </script>
</body>
</html>
