<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatchDay Dashboard</title>
  <style>
    :root {
      --bg-color: #060e08;
      --card-bg: #0d1810;
      --border-color: #1a2b1f;
      --accent-color: #22c55e;
      --text-color: #ffffff;
      --text-muted: #88998e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header & Suche */
    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .search-container {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    .search-container input {
      flex: 1;
      background: #09140b;
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-container input:focus {
      border-color: var(--accent-color);
    }

    .search-container button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Match Card Original Styling */
    #matchesContainer {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      position: relative;
    }

    .votes-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.08);
      color: #84cc16;
      border: 1px solid #84cc16;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .league-name {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .match-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .team {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Grünes Schild-Icon aus Original-UI */
    .shield-svg {
      width: 42px;
      height: 48px;
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 2.5;
    }

    .team span {
      font-weight: 700;
      font-size: 1.25rem;
      color: #fff;
    }

    .match-info h2 {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .match-info .sub-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
      font-weight: 500;
    }

    .match-info .location {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 8px;
    }

    /* Buttons */
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .btn-action {
      background: #142418;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 22px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: #1c3322;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ MatchDay Dashboard</h1>
  </header>

  <form id="searchForm" class="search-container">
    <input type="url" id="searchInput" placeholder="FuPa Spiel-Link einfügen..." required>
    <button type="submit">Laden</button>
  </form>

  <div class="section-title">⚡ Anstehende Matches</div>
  <div id="matchesContainer">
    <p style="text-align:center; color: var(--text-muted); padding: 20px;">Lade Spiele...</p>
  </div>

  <div class="section-title">📍 Spielstätten auf der Karte</div>
  <!-- Platzhalter für Kartenbereich -->
  <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; height: 200px; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
    Karte wird nach dem Laden angezeigt
  </div>

  <script src="app.js"></script>
</body>
</html>
